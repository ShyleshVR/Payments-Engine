spring:
  lifecycle:
    # On SIGTERM (pod shutdown / rolling update) finish in-flight requests before exiting.
    timeout-per-shutdown-phase: 20s
  application:
    name: ledger-service
  datasource:
    url: jdbc:postgresql://localhost:55433/ledger_db
    username: ledger_user
    password: ledger_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  security:
    oauth2:
      resourceserver:
        jwt:
          # Public keys from merchant-service, fetched on first use and cached: tokens keep
          # validating while merchant-service is down.
          jwk-set-uri: http://localhost:8084/oauth2/jwks
          issuer-uri: http://localhost:8084
          audiences: payflow-api
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: ledger-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    template:
      observation-enabled: true
    listener:
      observation-enabled: true

# Replies to the saga orchestrator go through a transactional outbox (see OutboxRelay).
outbox:
  publisher:
    # Replies wait for this poll on their way to the saga: kept short for payment latency.
    poll-interval: PT0.1S
    batch-size: 100
    send-timeout: 15s
    initial-backoff: 1s
    max-backoff: 1m
  cleanup:
    interval: PT1H
    retention: 7d

payflow:
  kafka:
    # Partitions of the topics this service creates (ledger-replies and its DLT).
    partitions: 12
    replication-factor: 1
    # Consumer threads per pod (see KafkaConsumerConfig); partitions bound a consumer group's
    # parallelism. The ledger runs 6 (other services 3): its consumers mostly wait on database commits, not CPU, so more of them in
    # flight let Postgres flush more commits per write (at 200 payments/s, 3 per pod fell behind and
    # late replies made the orchestrator re-send commands). 2 pods x 6 = the 12 partitions.
    listener-concurrency: 6

management:
  endpoint:
    health:
      # /actuator/health/liveness and /readiness for Kubernetes probes (also on outside K8s).
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

server:
  shutdown: graceful
  port: 8082

logging:
  level:
    org.apache.kafka.clients.NetworkClient: WARN
