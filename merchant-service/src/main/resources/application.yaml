spring:
  lifecycle:
    # On SIGTERM (pod shutdown / rolling update) finish in-flight requests before exiting.
    timeout-per-shutdown-phase: 20s
  application:
    name: merchant-service
  datasource:
    url: jdbc:postgresql://localhost:55435/merchant_db
    username: merchant_user
    password: merchant_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

payflow:
  auth:
    issuer: http://localhost:8084
    audience: payflow-api
    access-token-ttl: 15m
    max-active-credentials: 2
    bootstrap-admin:
      client-id: payflow-admin
      # Local development default only; set PAYFLOW_ADMIN_CLIENT_SECRET anywhere else.
      client-secret: ${PAYFLOW_ADMIN_CLIENT_SECRET:local-dev-admin-secret}
    # Internal services calling other services' APIs, each with only what it needs.
    # A client with a blank secret is not registered.
    service-clients:
      - client-id: reconciliation-service
        # Local development default only; set PAYFLOW_RECONCILIATION_CLIENT_SECRET anywhere else.
        client-secret: ${PAYFLOW_RECONCILIATION_CLIENT_SECRET:local-dev-reconciliation-secret}
        scopes: [ledger:admin, payments:audit, payouts:audit]
      - client-id: payout-service
        # Reads payable balances from the ledger. Local development default only.
        client-secret: ${PAYFLOW_PAYOUT_CLIENT_SECRET:local-dev-payout-secret}
        scopes: [ledger:admin]
      - client-id: incident-agent
        # The incident-investigation agent (a separate project). Read-only: it can look at sagas
        # and reconciliation runs, and can retry or start nothing. Local development default only.
        client-secret: ${PAYFLOW_INCIDENT_AGENT_CLIENT_SECRET:local-dev-incident-agent-secret}
        scopes: [payments:audit, payouts:audit, reconciliation:audit]
      - client-id: incident-agent-operator
        # The same agent's second login, used only to carry out what a person approved: retrying a
        # parked payment or payout saga, and running a failed day's reconciliation again (which
        # reads and compares; it moves no money). It cannot read the ledger or onboard anyone. Its
        # secret is held by the agent's service alone. Local development default only.
        client-secret: ${PAYFLOW_INCIDENT_AGENT_OPERATOR_CLIENT_SECRET:local-dev-incident-agent-operator-secret}
        scopes: [payments:operate, payouts:operate, reconciliation:admin]

management:
  endpoint:
    health:
      # /actuator/health/liveness and /readiness for Kubernetes probes (also on outside K8s).
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}

server:
  shutdown: graceful
  port: 8084
