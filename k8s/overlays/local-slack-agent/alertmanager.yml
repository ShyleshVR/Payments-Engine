# Same as k8s/overlays/local-slack/alertmanager.yml, plus the incident agent: every alert goes to
# Slack, to the agent and to alert-sink. Keep in step with local-slack's and local-agent's.
route:
  receiver: alert-sink
  group_by: [alertname, job, application]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h
  routes:
    - receiver: slack
      matchers: [severity =~ "critical|warning"]
      continue: true
    # every alert, including those the agent has no runbook for (it records them as such)
    - receiver: incident-agent
      matchers: [alertname =~ ".+"]
      continue: true
    - receiver: alert-sink
      matchers: [alertname =~ ".+"]

inhibit_rules:
  - source_matchers: [alertname = ServiceDown]
    target_matchers: [severity = warning]
    equal: [job]

receivers:
  - name: alert-sink
    webhook_configs:
      - url: http://alert-sink:9095/alerts
        send_resolved: true
  - name: slack
    slack_configs:
      - api_url_file: /etc/alertmanager/secrets/slack-webhook-url
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})'
        text: '{{ range .Alerts }}• {{ .Annotations.summary }} — runbook: {{ .Annotations.runbook }}{{ "\n" }}{{ end }}'
  - name: incident-agent
    webhook_configs:
      # the agent's Service in its own namespace: its pod (deployed with the agent's
      # scripts/k8s-deploy.sh up), or, for development, a name for this machine where
      # `payflow-agent serve` runs (k8s-deploy.sh host)
      - url: http://incident-agent.payflow-agent.svc.cluster.local:8092/alerts
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager/agent/token
