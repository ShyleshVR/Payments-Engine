# Same as k8s/base/observability/alertmanager.yml, plus a Slack receiver: every alert goes to
# Slack and to alert-sink.
route:
  receiver: alert-sink
  group_by: [alertname, job, application]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h
  routes:
    - receiver: slack
      matchers: [severity =~ "critical|warning"]
      continue: true
    - receiver: alert-sink
      matchers: [severity =~ ".+"]

inhibit_rules:
  - source_matchers: [alertname = ServiceDown]
    target_matchers: [severity = warning]
    equal: [job]

receivers:
  - name: alert-sink
    webhook_configs:
      - url: http://alert-sink:9095/alerts
        send_resolved: true
  - name: slack
    slack_configs:
      - api_url_file: /etc/alertmanager/secrets/slack-webhook-url
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})'
        text: '{{ range .Alerts }}• {{ .Annotations.summary }} — runbook: {{ .Annotations.runbook }}{{ "\n" }}{{ end }}'
