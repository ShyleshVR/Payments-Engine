# In-cluster scrape config: discovers pods in the payflow namespace through the Kubernetes API
# and scrapes those annotated prometheus.io/scrape: "true", so new replicas (including
# autoscaled ones) are picked up without editing this file.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alert rules (alerts.yml, unit-tested with promtool) and where firing alerts go.
rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: payflow-pods
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [payflow]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        target_label: __address__
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
      # job = the service name (same job names as the docker-compose setup), instance = pod.
      - source_labels: [__meta_kubernetes_pod_label_app]
        target_label: job
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
