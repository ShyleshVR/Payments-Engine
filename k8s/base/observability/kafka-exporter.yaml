# Consumer-group lag and topic offsets from the broker itself, so lag is visible even when every
# consumer is dead (consumers' own metrics vanish with them). Scraped like the services.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-exporter
  template:
    metadata:
      labels:
        app: kafka-exporter
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "9308"
    spec:
      containers:
        - name: kafka-exporter
          image: danielqsj/kafka-exporter:v1.9.0
          args:
            - --kafka.server=kafka:9092
          ports:
            - containerPort: 9308
          readinessProbe:
            httpGet: { path: /metrics, port: 9308 }
            periodSeconds: 15
            failureThreshold: 10
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
