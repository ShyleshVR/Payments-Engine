# Single Kafka broker in KRaft mode (broker and controller in one process, no ZooKeeper).
# Replication factor 1 means no fault tolerance: production would run 3+ brokers with RF 3 and
# min.insync.replicas 2 (PAYFLOW_KAFKA_REPLICATION_FACTOR then becomes 3).
apiVersion: v1
kind: Service
metadata:
  name: kafka
spec:
  selector:
    app: kafka
  ports:
    - name: broker
      port: 9092
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      priorityClassName: payflow-infrastructure
      securityContext:
        # The image runs as appuser (1000); make the volume writable for it.
        fsGroup: 1000
      containers:
        - name: kafka
          image: apache/kafka:4.0.0
          ports:
            - name: broker
              containerPort: 9092
            - name: controller
              containerPort: 9093
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://:9092,CONTROLLER://:9093
            # One broker, so clients can be pointed at the Service name.
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka:9092
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@localhost:9093
            # Fixed so the formatted volume is reused across pod restarts.
            - name: CLUSTER_ID
              value: payflow-local-kraft01
            - name: KAFKA_LOG_DIRS
              value: /var/lib/kafka/data
            # Topics are created explicitly by the services; if one is ever auto-created
            # (e.g. a producer racing a service's startup) it still gets enough partitions.
            - name: KAFKA_NUM_PARTITIONS
              value: "3"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_HEAP_OPTS
              value: -Xms256m -Xmx512m
          readinessProbe:
            tcpSocket: { port: broker }
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: broker }
            initialDelaySeconds: 60
            periodSeconds: 15
          resources:
            requests: { cpu: 250m, memory: 768Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
