spring:
  lifecycle:
    # On SIGTERM (pod shutdown / rolling update) finish in-flight requests before exiting.
    timeout-per-shutdown-phase: 20s
  application:
    name: payment-service
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # Fail fast instead of blocking the outbox publisher when the broker is unreachable.
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    template:
      observation-enabled: true
    # Ledger replies to saga commands.
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      observation-enabled: true
  datasource:
    url: jdbc:postgresql://localhost:55432/payflow
    username: payflow
    password: payflow
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: localhost
      port: 6379

  jpa:
    hibernate:
      ddl-auto: validate

    open-in-view: false

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          # Public keys from merchant-service, fetched on first use and cached: tokens keep
          # validating while merchant-service is down.
          jwk-set-uri: http://localhost:8084/oauth2/jwks
          issuer-uri: http://localhost:8084
          audiences: payflow-api

outbox:
  publisher:
    # Saga commands travel through the outbox too, and every hop of a payment waits for one
    # poll: kept short for latency (the claim query is cheap).
    poll-interval: PT0.1S
    batch-size: 100
    send-timeout: 15s
    initial-backoff: 1s
    max-backoff: 5m
  cleanup:
    interval: PT1H
    retention: 7d

payflow:
  kafka:
    # Topics this service owns are created with these settings (see KafkaTopicsConfig).
    partitions: 12
    replication-factor: 1
    # Consumer threads per pod (see KafkaConsumerConfig). Partitions bound the parallelism of a
    # consumer group: 12 leave room for 4 pods x 3 threads.
    listener-concurrency: 3
  # The card processor (processor-simulator locally).
  processor:
    base-url: http://localhost:8086
    api-key: ${PAYFLOW_PROCESSOR_API_KEY:local-dev-processor-key}
    connect-timeout: 1s
    read-timeout: 5s
  # Payment and refund sagas (see SagaProperties for what each setting means).
  saga:
    poll-interval: 100ms
    workers: 8
    max-in-flight: 100
    lease: 30s
    authorization-ttl: 7d
    step-timeouts:
      authorize: 2m
      capture: 10m
      voiding: 24h
      refund: 10m
    retry:
      initial-backoff: 1s
      max-backoff: 30s
    replies:
      timeout: 15s
      max-timeout: 5m

# Processor calls fail fast while the processor keeps failing (UNKNOWN outcomes only: declines
# are answers, not failures), then a few trial calls decide whether it is back.
resilience4j:
  circuitbreaker:
    instances:
      processor:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - com.shylesh.payment_service.processor.ProcessorUnavailableException

management:
  endpoint:
    health:
      # /actuator/health/liveness and /readiness for Kubernetes probes (also on outside K8s).
      probes:
        enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Buckets for the Grafana percentile panels.
      percentiles-histogram:
        saga.duration: true
        processor.calls: true

logging:
  level:
    org.apache.kafka.clients.NetworkClient: WARN
    org.apache.kafka.clients.consumer.internals.ConsumerCoordinator: WARN

server:
  shutdown: graceful
  port: 8080
