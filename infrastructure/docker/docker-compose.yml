services:
  postgres:
    image: postgres:17
    container_name: payflow-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: payflow
      POSTGRES_USER: payflow
      POSTGRES_PASSWORD: payflow

    ports:
      - "55432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  postgres-notification:
    image: postgres:17
    container_name: notification-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: notification_user
      POSTGRES_PASSWORD: notification_password
      TZ: UTC
      PGTZ: UTC
    ports:
      - "55431:5432"

    volumes:
      - postgres_notification_data:/var/lib/postgresql/data

  postgres-ledger:
    image: postgres:17
    container_name: ledger-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: ledger_db
      POSTGRES_USER: ledger_user
      POSTGRES_PASSWORD: ledger_password
      TZ: UTC
      PGTZ: UTC
    ports:
      - "55433:5432"

    volumes:
      - postgres_ledger_data:/var/lib/postgresql/data

  postgres-webhook:
    image: postgres:17
    container_name: webhook-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: webhook_db
      POSTGRES_USER: webhook_user
      POSTGRES_PASSWORD: webhook_password
      TZ: UTC
      PGTZ: UTC
    ports:
      - "55434:5432"

    volumes:
      - postgres_webhook_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: payflow-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.0.0
    container_name: payflow-kafka

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: payflow-jaeger
    restart: unless-stopped

    environment:
      COLLECTOR_OTLP_ENABLED: "true"

    ports:
      - "16686:16686"   # UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: payflow-prometheus
    restart: unless-stopped

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

    ports:
      - "9090:9090"

    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.3.0
    container_name: payflow-grafana
    restart: unless-stopped

    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin

    ports:
      - "3000:3000"

    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

    depends_on:
      - prometheus

volumes:
  postgres_data:
  postgres_notification_data:
  postgres_ledger_data:
  postgres_webhook_data:
  grafana_data:
